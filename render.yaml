databases:
  - name: smart-recommend-postgres
    databaseName: smart_recommend_ai
    user: app_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: smart-recommend-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: SIGNUP_BONUS_CREDITS
        value: "5"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: smart-recommend-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Filled in automatically once the frontend service exists (its public URL).
      - key: CORS_ORIGIN
        fromService:
          name: smart-recommend-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          name: smart-recommend-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Optional — fill in from the Render Dashboard if/when you enable real Stripe billing.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: smart-recommend-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      # Baked into the static build at build time — Render passes this as a
      # Docker build arg automatically (see render.com/docs/docker).
      #
      # Render Blueprints can't concatenate a referenced service's URL with a
      # path suffix, so this uses the predictable onrender.com URL based on
      # the backend service's name above. After your first deploy, check the
      # backend service's actual URL in the Render dashboard — if it differs
      # (e.g. the name was already taken and Render appended a suffix),
      # update this value and manually redeploy the frontend.
      - key: VITE_API_URL
        value: https://smart-recommend-backend.onrender.com/api
